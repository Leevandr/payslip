[package]
name = "payroll-commit"
description = "Employer-owned commitments (Merkle roots) for payroll runs, with revoke and history"
version = "0.1.0"
edition = "2024"
resolver = "3"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.24"

[dev-dependencies]
near-sdk = { version = "5.24", features = ["unit-testing"] }
near-workspaces = { version = "0.22", features = ["unstable"] }
tokio = { version = "1.12.0", features = ["full"] }
serde_json = "1"

[profile.release]
codegen-units = 1
# Optimise for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Extra safety checks on arithmetic.
overflow-checks = true
